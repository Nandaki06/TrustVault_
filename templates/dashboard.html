
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>TrustVault</h1>
    <p>Secure Documents. Trusted Access.</p>

    {% if role == 'admin' %}

        <h2>Admin Dashboard</h2>
        <p>Manage and monitor document activity.</p>

        <a href="{{ url_for('admin_audit') }}">
            View Admin Audit
        </a>

    {% else %}

        <h2>Welcome to Your Dashboard</h2>
        <p>Your documents. One secure place.</p>

        <h3>Upload Document</h3>

        <form action="{{ url_for('upload') }}"
              method="POST"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <label>Select Document</label>
            <input type="file"
                   name="document"
                   accept=".pdf,.png,.jpg,.jpeg,.docx"
                   required>

            <label>Category</label>
            <input type="text"
                   name="category"
                   placeholder="Example: Certificates">

            <button type="submit">Upload Document</button>

        </form>

        <br>

        <a href="{{ url_for('documents') }}">
            My Documents
        </a>

    {% endif %}

    <br><br>

    <form action="{{ url_for('logout') }}" method="POST">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">
        <button type="submit">Logout</button>
    </form>

</body>
</html>
